<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" width="100%" height="100%">
  <defs>
    <linearGradient id="sf-full-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="60%" stop-color="#3a86ff"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
    <linearGradient id="sf-full-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#ff5400"/>
    </linearGradient>
    <linearGradient id="sf-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f0f7ff"/>
      <stop offset="85%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
    <filter id="sf-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon Group -->
  <g transform="translate(6, 6) scale(0.6)">
    <!-- Ambient Ring -->
    <circle cx="50" cy="50" r="46" fill="#0d1527" stroke="url(#sf-full-cyan)" stroke-width="2.5" stroke-dasharray="12 4 20 4 8 4"/>
    <circle cx="50" cy="50" r="38" fill="#080c16" stroke="#9d4edd" stroke-width="1.5" stroke-dasharray="6 6"/>

    <!-- Anvil Body -->
    <path d="M 28 42 L 72 42 Q 76 42 75 46 L 70 54 L 58 54 L 56 64 L 66 68 L 66 74 L 34 74 L 34 68 L 44 64 L 42 54 L 26 54 Q 22 47 28 42 Z" 
          fill="url(#sf-full-cyan)" filter="url(#sf-glow-filter)"/>
    
    <!-- Diamond Spark -->
    <polygon points="50,22 59,35 50,48 41,35" fill="url(#sf-full-gold)"/>

    <!-- Wave lines -->
    <line x1="38" y1="46" x2="38" y2="50" stroke="#050811" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="44" y1="44" x2="44" y2="52" stroke="#050811" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="50" y1="42" x2="50" y2="54" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="56" y1="44" x2="56" y2="52" stroke="#050811" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="62" y1="46" x2="62" y2="50" stroke="#050811" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Particles -->
    <circle cx="30" cy="28" r="2" fill="#ffb703"/>
    <circle cx="70" cy="26" r="2.2" fill="#00f3ff"/>
    <circle cx="78" cy="38" r="1.6" fill="#ff5400"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(80, 0)">
    <!-- Primary Wordmark -->
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-weight="900" font-size="28" letter-spacing="1.5" fill="url(#sf-text-grad)">
      SKILL<tspan fill="#00f3ff">FORGE</tspan>
    </text>

    <!-- Alexa+ Badge Pill -->
    <rect x="180" y="21" width="76" height="20" rx="10" fill="#0b253a" stroke="#00f3ff" stroke-width="1.2"/>
    <text x="218" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="10.5" font-weight="800" fill="#00f3ff" text-anchor="middle" letter-spacing="0.5">
      ALEXA+
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="600" font-size="9.5" letter-spacing="2" fill="#8da4c4" text-transform="uppercase">
      Voice-First DSA Companion <tspan fill="#9d4edd">•</tspan> Bedrock Claude 3.5
    </text>
  </g>
</svg>
