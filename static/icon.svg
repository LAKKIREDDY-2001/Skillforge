<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="sf-grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#3a86ff"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
    <linearGradient id="sf-grad-gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7b00"/>
      <stop offset="50%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#00f3ff"/>
    </linearGradient>
    <radialGradient id="sf-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#9d4edd" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
    <filter id="sf-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="50" cy="50" r="46" fill="url(#sf-glow)"/>

  <!-- Outer Alexa Voice Ring with Gap Accents -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="url(#sf-grad-cyan)" stroke-width="2" stroke-dasharray="8 4 16 4 28 6" opacity="0.85"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="#9d4edd" stroke-width="1" stroke-dasharray="4 6 12 4" opacity="0.6"/>

  <!-- SkillForge Stylized Hexagonal Anvil Core -->
  <g filter="url(#sf-shadow)">
    <!-- Base Anvil Horns -->
    <path d="M 28 42 
             L 72 42 
             Q 76 42 75 46 
             L 70 54 
             L 58 54 
             L 56 64 
             L 66 68 
             L 66 74 
             L 34 74 
             L 34 68 
             L 44 64 
             L 42 54 
             L 26 54 
             Q 22 47 28 42 Z" 
          fill="url(#sf-grad-cyan)" />
    
    <!-- Central Forge Diamond / Spark Core -->
    <polygon points="50,22 59,35 50,48 41,35" fill="url(#sf-grad-gold)"/>

    <!-- Voice Sound Wave Bars intersecting Anvil Core -->
    <line x1="38" y1="46" x2="38" y2="50" stroke="#050811" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="44" y1="44" x2="44" y2="52" stroke="#050811" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="50" y1="42" x2="50" y2="54" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="56" y1="44" x2="56" y2="52" stroke="#050811" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="62" y1="46" x2="62" y2="50" stroke="#050811" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Sparkling Forge Particle Sparks -->
    <circle cx="32" cy="30" r="1.8" fill="#ffb703"/>
    <circle cx="68" cy="28" r="2.2" fill="#00f3ff"/>
    <circle cx="76" cy="38" r="1.5" fill="#ff7b00"/>
    <circle cx="23" cy="39" r="1.5" fill="#9d4edd"/>
  </g>
</svg>
